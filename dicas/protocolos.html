<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRINCIPAIS PROTOCOLOS — Dica DevMapas</title>
<meta name="description" content="Teste seus conhecimentos com esta dica de Informática para concursos.">
<!-- PRÉVIA AO COMPARTILHAR: imagem definida no campo Imagem para compartilhar -->
<meta property="og:type" content="website">
<meta property="og:title" content="PRINCIPAIS PROTOCOLOS — Dica de Informática | DevMapas">
<meta property="og:description" content="Teste seus conhecimentos com esta dica de Informática para concursos.">
<meta property="og:image" content="https://devmapas.vercel.app/img/dica-protocolos.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://devmapas.vercel.app/img/dica-protocolos.png">
<style>
:root{--g:#7a4fd6;--gd:#3b1d6e;--gl:#efe8fb;--bg:#f7f4fd;--tx:#1f1a33;--mu:#6b6485;--bd:#e4def0;--ok:#16a34a;--bad:#d97706;--wa:#25D366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.hero{background:linear-gradient(160deg,#6a3fc4,#3b1d6e);color:#fff;border-radius:24px;padding:14px 16px;text-align:center;box-shadow:0 8px 22px rgba(59,29,110,.2)}
.kick{font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.9}
h1{font-size:20px;line-height:1.25;margin:6px 0 0}
.mem{margin-top:12px;background:#fff9e6;border-left:5px solid #f4b400;border-radius:12px;padding:10px 12px;font-size:15px}
.mem b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.como{list-style:none;margin:12px 0 0;padding:12px 14px;background:#fff;border:1px solid var(--bd);border-radius:18px;font-size:14px;display:grid;gap:6px;color:var(--gd)}
#itens{margin-top:12px;display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 3px 12px rgba(59,29,110,.06);overflow:hidden}
.item.aberto{border-color:var(--g)}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:12px 16px;border:0;background:none;font:inherit;font-weight:800;color:var(--gd);text-align:left;cursor:pointer}
.item-h .nome{min-width:0;overflow-wrap:anywhere}
.item-h .sinal{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:18px;line-height:1}
.item-c{padding:0 16px 14px}
.item-c p{margin:0 0 8px;overflow-wrap:anywhere}
.transicao,.teste{text-align:center;margin-top:18px}
.transicao h2,.teste h2{font-size:18px;color:var(--gd);margin:0}
.transicao p,.teste p{margin:4px 0 0}
.seta{font-weight:700;color:var(--gd)}
.teste #rodada{text-align:left}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;padding:12px;margin-top:12px;font:inherit;font-weight:800;letter-spacing:.03em;background:var(--g);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:none}
.card{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 4px 16px rgba(59,29,110,.08);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.passo{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--g)}
.enun{font-weight:600;margin:6px 0 12px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;align-items:center;width:100%;min-height:52px;text-align:left;font:inherit;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--tx)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fff4e0}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;margin-top:4px}
.fb.ok{background:#dcfce7}.fb.bad{background:#fff4e0}
.fb h3{margin:0 0 4px;font-size:17px}.fb p{margin:4px 0}
.final{text-align:center}
.final h2{margin:0;color:var(--gd)}
.placar{font-size:40px;font-weight:800;color:var(--gd);line-height:1.2}
.frase{margin:10px 0 0;font-size:18px;font-weight:700;color:var(--gd)}
.go{border-radius:22px;padding:16px;margin-top:12px;border:2px solid #d9cdf3;background:#fff;text-align:center}
.go h2{font-size:16px;line-height:1.25;margin:0;color:var(--gd)}
.go p{font-size:13.5px;line-height:1.45;margin:8px 0 0;color:#4b4264}
.go .btn{margin-top:14px;padding:13px;font-size:14px}
.capa{width:132px;min-height:132px;margin:0 auto 12px;border-radius:16px;background:var(--gl);border:2px dashed #d6c8f3;display:grid;place-items:center;font-size:38px;overflow:hidden;box-shadow:0 4px 12px rgba(59,29,110,.14)}
.capa img{display:block;width:100%;height:auto}
.capa.has{min-height:0;border:0;font-size:0;background:#fff}
.importante{margin-top:14px;background:#fff4cc;border:2px solid #f4b400;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:800;color:#5a3b00}
.importante span{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:3px}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.wbtn svg{flex:none;width:20px;height:20px;fill:currentColor}
.go.wa .okick{color:#128C7E}
.go.wa h2{color:#075E54}
.go.gr .okick{color:#7ee2a8}
.go.gr .wbtn svg{fill:#25D366}
.go.a{border-top:6px solid var(--g)}
.go.b{background:#ece3fb;border-color:#c9b6f0}
.go.b .btn{background:var(--gd)}
.go.b .okick{color:var(--gd)}
.go.wa{background:#e9fbef;border-color:var(--wa)}
.go.wa .ico{background:var(--wa)}
.go.wa .btn{background:var(--wa);color:#053b1d;font-size:13.5px;letter-spacing:0}
.go.gr{background:#075E54;border-color:#075E54}
.go.gr h2{color:#fff}.go.gr p{color:#d3efe3}
.go.gr .ico{background:#128C7E}
.go.gr .btn{background:#fff;color:#075E54}
.go.wa .lista{list-style:none;margin:10px auto 0;padding:0;display:inline-block;text-align:left;font-size:14px;line-height:1.75;color:#2f5d4a}
.okick{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--g);margin:0 0 6px}
.go{font-size:15px;line-height:1.5}
.go .btn{min-height:0;text-align:center;text-decoration:none}
.go.wa .okick{color:#128C7E}
.go.gr .okick{color:#7ee2a8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="kick">💡 DICA DEVMAPAS</div>
    <h1>PRINCIPAIS PROTOCOLOS</h1>
  </header>
  <ul class="como" id="como"></ul>
  <section id="itens" aria-label="Itens da dica"></section>
  <section class="transicao" id="transicao" hidden>
    <h2>🎉 VOCÊ CHEGOU ATÉ AQUI!</h2>
    <p>Gostou das dicas?</p>
    <p class="seta">👇 Continue rolando para conhecer os materiais do DevMapas.</p>
  </section>
  <section id="area-ofertas" aria-label="Materiais do DevMapas" hidden></section>
  <section class="teste" aria-label="Questões extras">
    <h2>🧠 QUER TESTAR O QUE VOCÊ APRENDEU?</h2>
    <p>Você chegou ao final das dicas.</p>
    <p class="seta" id="tq"></p>
    <div id="rodada"></div>
  </section>
</div>
<script src="../config/ofertas.js"></script>
<script>
const D = {"f":"Agora você já revisou os principais protocolos cobrados em concursos.","o":["internet_navegadores","simulado","personalizado","grupo"],"itens":[{"itens":[{"n":"HTTP","e":"Protocolo utilizado na comunicação entre cliente e servidor na Web.","m":"HTTP → Web"},{"n":"HTTPS","e":"Versão do HTTP que utiliza mecanismos de segurança, incluindo criptografia, para proteger a comunicação.","m":"HTTPS → HTTP + segurança"}]},{"itens":[{"n":"FTP","e":"Protocolo utilizado para transferência de arquivos entre sistemas.","m":"FTP → arquivos"},{"n":"SFTP","e":"Protocolo de transferência de arquivos que utiliza uma conexão segura baseada em SSH.","m":"SFTP → arquivos + SSH"}]},{"itens":[{"n":"SMTP","e":"Protocolo utilizado para o envio de mensagens de e-mail.","m":"SMTP → envia"},{"n":"POP3","e":"Protocolo utilizado para receber e-mails, tradicionalmente associado ao download das mensagens para o dispositivo.","m":"POP3 → recebe/baixa"}]},{"itens":[{"n":"IMAP","e":"Protocolo de acesso a e-mails que mantém as mensagens sincronizadas com o servidor.","m":"IMAP → sincroniza"},{"n":"DNS","e":"Sistema responsável por resolver nomes de domínio em endereços IP.","m":"DNS → nome → IP"}]},{"itens":[{"n":"DHCP","e":"Protocolo que permite a configuração automática de parâmetros de rede, como endereço IP, máscara e gateway.","m":"DHCP → configura IP automaticamente"},{"n":"TCP/IP","e":"Conjunto de protocolos utilizado na comunicação e na troca de dados em redes, incluindo a Internet.","m":"TCP/IP → comunicação em rede"}]}],"q":[{"e":"Um usuário acessa um site pelo nome de domínio. O navegador precisa descobrir qual endereço IP corresponde àquele domínio antes de estabelecer a comunicação com o servidor.","a":["DHCP","DNS","IMAP"],"c":1,"x":"O DNS realiza a resolução de nomes, relacionando o domínio ao endereço IP correspondente.","m":"DNS → nome → IP"},{"e":"Um usuário acessa sua conta de e-mail em diferentes dispositivos e deseja manter as mensagens e alterações sincronizadas com o servidor.","a":["POP3","SMTP","IMAP"],"c":2,"x":"O IMAP mantém o gerenciamento das mensagens associado ao servidor, permitindo a sincronização entre dispositivos.","m":"IMAP → sincroniza"},{"e":"Um administrador precisa transferir arquivos entre computadores, mas exige que a transferência ocorra por meio de uma conexão segura baseada em SSH.","a":["FTP","SFTP","SMTP"],"c":1,"x":"O SFTP utiliza SSH para realizar a transferência segura de arquivos.","m":"SFTP → arquivos + SSH"}]};
const NL = String.fromCharCode(10);
const $ = (id) => document.getElementById(id);
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function paragrafos(no, txt) { txt.split(NL).forEach((l) => { if (l.trim()) no.appendChild(el('p', '', l)); }); return no; }
function memorizar(txt) { const m = el('div', 'mem'); m.append(el('b', '', '🧠 PARA MEMORIZAR')); paragrafos(m, txt); return m; }

/* ----- como usar + itens expansíveis (textos fixos genéricos, servem para qualquer mapa) ----- */
const nq = D.q.length;
['📌 Toque em cada item para abrir a explicação.', '👇 Role a tela para conhecer todas as dicas.', '🧠 No final, você ainda poderá testar seus conhecimentos com ' + nq + ' questões.']
  .forEach((t) => $('como').append(el('li', '', t)));
$('tq').textContent = '👇 Role mais um pouco para responder ' + nq + ' questões rápidas.';
D.itens.forEach((g, i) => {
  const box = el('article', 'item');
  const h = el('button', 'item-h'); h.type = 'button'; h.setAttribute('aria-expanded', 'false'); h.setAttribute('aria-controls', 'item-' + i);
  const sinal = el('span', 'sinal', '＋'); sinal.setAttribute('aria-hidden', 'true');
  h.append(el('span', 'nome', g.itens.map((x) => x.n).join(' + ')), sinal);
  const c = el('div', 'item-c'); c.id = 'item-' + i; c.hidden = true;
  g.itens.forEach((x, k) => {
    const bloco = el('div'); if (k > 0) bloco.style.marginTop = '14px';
    if (g.itens.length > 1) { const p = el('p'); p.append(el('strong', '', x.n)); bloco.append(p); }   // com 2 itens, o nome de cada um aparece dentro do card
    bloco.append(paragrafos(el('div'), x.e)); if (x.m) bloco.append(memorizar(x.m));
    c.append(bloco);
  });
  h.addEventListener('click', () => { const abrir = c.hidden; c.hidden = !abrir; h.setAttribute('aria-expanded', String(abrir)); sinal.textContent = abrir ? '−' : '＋'; box.classList.toggle('aberto', abrir); });
  box.append(h, c); $('itens').append(box);
});

/* ----- questões extras (depois das ofertas) ----- */
let qi = 0, acertos = 0;
const rodada = $('rodada');

function questao() {
  const q = D.q[qi];
  rodada.textContent = '';
  const card = el('div', 'card');
  card.append(el('div', 'passo', '⚡ QUESTÃO ' + (qi + 1) + ' DE ' + D.q.length), el('p', 'enun', q.e));
  const opts = el('div');
  q.a.forEach((txt, i) => {
    const b = el('button', 'opt'); b.type = 'button';
    b.append(el('b', '', 'ABC'[i]), el('span', '', txt));
    b.addEventListener('click', () => responder(i, opts, card));
    opts.append(b);
  });
  card.append(opts);
  rodada.append(card);
}

function responder(i, opts, card) {
  const q = D.q[qi], certo = i === q.c;
  if (certo) acertos++;
  [...opts.children].forEach((b, k) => { b.disabled = true; if (k === q.c) b.classList.add('ok'); else if (k === i) b.classList.add('bad'); });
  const fb = el('div', 'fb ' + (certo ? 'ok' : 'bad'));
  fb.append(el('h3', '', certo ? '✅ VOCÊ ACERTOU!' : '❌ NÃO FOI DESSA VEZ!'), el('p', '', 'Resposta certa: ' + 'ABC'[q.c]), paragrafos(el('div'), q.x));
  if (q.m) fb.append(memorizar(q.m));
  const ultimo = qi === D.q.length - 1;
  const prox = el('button', 'btn', ultimo ? 'VER RESULTADO →' : 'PRÓXIMA QUESTÃO →'); prox.type = 'button';
  prox.addEventListener('click', () => { if (ultimo) fim(); else { qi++; questao(); rodada.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
  card.append(fb, prox);
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ----- ofertas: cards .go no fluxo normal da página, depois dos itens (só os IDs ficam salvos; dados de ../config/ofertas.js) ----- */
const WA_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
(function () {
  if (!D.o || !D.o.length || typeof OFERTAS === 'undefined') return;
  const mapas = typeof MAPAS_INDIVIDUAIS === 'undefined' ? {} : MAPAS_INDIVIDUAIS;
  const lista = D.o.map((id) => mapas[id] || OFERTAS[id]).filter(Boolean);
  if (!lista.length) return;
  const area = $('area-ofertas');
  lista.forEach((o) => {
    const card = el('div', (o.classe || '').indexOf('go') === 0 ? o.classe : 'go a');
    if (o.imagem) {
      const capa = el('div', 'capa', o.capaEmoji || ''); card.append(capa);
      const im = new Image(); im.alt = 'Capa'; im.onload = () => { capa.append(im); capa.classList.add('has'); }; im.src = o.imagem;
    }
    card.append(el('div', 'okick', o.kick || o.nome || ''), el('h2', '', o.titulo || ''));
    (o.textos || []).forEach((t) => card.append(el('p', '', t)));
    if (o.importante) { const i = el('div', 'importante'); i.append(el('span', '', '📌 IMPORTANTE'), document.createTextNode(o.importante)); card.append(i); }
    const a = el('a', 'btn' + (o.iconeWhatsapp ? ' wbtn' : ''));
    if (o.link && /^https?:/i.test(o.link)) { a.href = o.link; a.target = '_blank'; a.rel = 'noopener'; }
    if (o.iconeWhatsapp) { a.innerHTML = WA_SVG; a.append(el('span', '', o.botao || '')); } else a.textContent = o.botao || '';
    card.append(a); area.append(card);
  });
  area.hidden = false; $('transicao').hidden = false;
})();

function fim() {
  rodada.textContent = '';
  const c = el('div', 'card final');
  c.append(el('h2', '', '🎉 RODADA CONCLUÍDA!'), el('p', '', 'Você terminou essa dica!'));
  if (D.f) c.append(el('p', 'frase', D.f));
  rodada.append(c);
}
questao();
</script>
</body>
</html>
